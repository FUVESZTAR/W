<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NFC Serial Saver</title>
<link rel="icon" href="ico/favicon.ico" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --green:#2f7d32; --green-mid:#388e3c; --green-light:#4caf50;
  --green-pale:#e8f5e9; --green-pale2:#c8e6c9; --muted:#546354;
  --charcoal:#172217; --bg:#f5f8f3; --card:#fff;
  --border:rgba(47,125,50,.15);
  --shadow:0 4px 24px rgba(23,34,23,.08); --shadow-lg:0 12px 48px rgba(23,34,23,.14);
  --radius:18px; --radius-sm:10px; --tr:.22s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'DM Sans',sans-serif;
  background:radial-gradient(circle at top right,#dff0d8 0,var(--bg) 45%);
  color:var(--charcoal); line-height:1.6; min-height:100vh;
  cursor:url('ico/leaf.cur') 0 0, auto;
}
.page-wrapper{width:min(760px,96vw);margin:0 auto;padding:1rem 0 3rem;display:flex;flex-direction:column;gap:1rem}
.page-header{display:flex;align-items:center;justify-content:space-between;padding:.6rem 0;gap:.5rem;flex-wrap:wrap}
.page-title{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,4vw,1.9rem);font-weight:700;color:var(--green);line-height:1.1}
.page-subtitle{font-size:.82rem;color:var(--muted);font-weight:300}

/* Toggle groups (language + mode) */
.toggle{display:flex;background:var(--green-pale2);border-radius:20px;padding:3px;gap:2px}
.toggle button{
  flex:1;padding:6px 14px;border-radius:16px;font-size:.8rem;font-weight:600;border:none;
  background:transparent;color:var(--green-mid);cursor:pointer;transition:all var(--tr);
  font-family:'DM Sans',sans-serif;
}
.toggle button.active{background:var(--green);color:#fff}
.toggle button:hover:not(.active){background:rgba(47,125,50,.12)}
.toggle.lang{flex-shrink:0}

/* Panels */
.panel{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow var(--tr)}
.panel:hover{box-shadow:var(--shadow-lg)}
.panel-header{display:flex;align-items:center;gap:9px;padding:16px 20px;border-bottom:1px solid var(--border)}
.panel-icon{font-size:1.2rem}
.panel-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:600;color:var(--green)}
.panel-subtitle{font-size:.73rem;color:var(--muted);font-weight:300}
.panel-header .grow{flex:1;min-width:0}
.panel-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.badge{padding:2px 10px;border-radius:10px;font-size:.78rem;background:var(--green-pale2);color:var(--green);font-weight:600}

/* Buttons */
.btn-grid{display:grid;gap:9px}
.btn-grid.one{grid-template-columns:1fr}
.btn-grid.cols-2 { grid-template-columns:1fr 1fr; }
.btn-grid.cols-1 { grid-template-columns:1fr; }
button.btn{
  padding:.75rem 1rem;font-size:.92rem;font-family:'DM Sans',sans-serif;border:none;
  border-radius:var(--radius-sm);cursor:pointer;font-weight:500;width:100%;
  transition:transform .15s,background var(--tr);
}
button.btn-primary{background:var(--green);color:#fff}
button.btn-primary:hover:not(:disabled){background:var(--green-mid);transform:translateY(-1px)}
button.btn-danger{background:#c62828;color:#fff}
button.btn-danger:hover:not(:disabled){background:#b71c1c}
button.btn-secondary{background:var(--green-pale2);color:var(--green);border:1px solid var(--border)}
button.btn-secondary:hover:not(:disabled){background:var(--green-pale)}
button.btn-back {background: none;color: var(--muted);border: 1px solid var(--border);font-size: .85rem;}
button:disabled{opacity:.55;cursor:not-allowed}

/* Status */
.status-box{
  text-align:center;font-weight:600;font-size:.88rem;padding:10px 12px;
  border-radius:var(--radius-sm);background:var(--green-pale);color:var(--muted);transition:.3s;
}
.status-box.info{background:#e3f0fc;color:#1565c0}
.status-box.success{background:var(--green-pale2);color:var(--green)}
.status-box.error{background:#fdecea;color:#c62828}
.status-box.warn{background:#fff4e0;color:#b26a00}
.live{color:var(--green-light);animation:blink 1s infinite;font-weight:700}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* Last read + list */
.label{font-size:.79rem;font-weight:500}
.preview{
  background:var(--green-pale);padding:12px 14px;border-radius:var(--radius-sm);word-break:break-all;
  font-family:monospace;font-size:.84rem;border:1px solid var(--border);min-height:48px;
}
.list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto}
.item{display:flex;align-items:flex-start;gap:10px;background:var(--green-pale);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px}
.item .num{font-weight:600;color:var(--green);min-width:1.6em}
.item .txt{flex:1;min-width:0;word-break:break-all}
.item .ser{font-family:monospace;font-weight:600;font-size:.88rem}
.item .con{font-family:monospace;font-size:.78rem;color:var(--muted)}
.item .del{border:none;background:none;color:#c62828;font-size:1.1rem;cursor:pointer;line-height:1}
.empty{text-align:center;color:var(--muted);font-size:.85rem;padding:10px}
@media(max-width:480px){.btn-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="page-wrapper">

  <div class="page-header">
    <div>
      <div class="page-title">🌿 NFC</div>
      <div class="page-subtitle" data-i18n="subtitle">NFC Serial Saver</div>
    </div>
    <div class="toggle lang">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="hu">HU</button>
    </div>
  </div>

  <!-- Panel 1: Mode + scan -->
  <section class="panel">
    <div class="panel-header">
      <span class="panel-icon">📡</span>
      <div class="grow">
        <div class="panel-title" data-i18n="scan_title">Scan</div>
        <div class="panel-subtitle" data-i18n="scan_sub">Choose a mode and read the tags</div>
      </div>
      <span id="liveDot" class="live" style="display:none">● LIVE</span>
    </div>
    <div class="panel-body">
      <div class="toggle" id="modeToggle">
        <button type="button" data-mode="single" class="active" data-i18n="mode_single">Single (auto-save)</button>
        <button type="button" data-mode="multi" data-i18n="mode_multi">Multiple (session)</button>
      </div>
      <div class="btn-grid cols-2">
        <button id="startBtn" class="btn btn-primary" type="button" data-i18n="btn_start">Start reading</button>
        <button id="stopBtn" class="btn btn-danger" type="button" data-i18n="btn_stop" disabled>Stop reading</button>
      </div>
      <div id="status" class="status-box" data-i18n="st_ready">Ready. Press “Start reading”.</div>
      <div class="btn-grid cols-1">
          <button id="backBtn" class="btn-back" type="button" data-i18n="btn_back">← Back</button>
      </div>
    </div>
  </section>

  <!-- Panel 2: Last read -->
  <section class="panel">
    <div class="panel-header">
      <span class="panel-icon">🔍</span>
      <div class="grow">
        <div class="panel-title" data-i18n="last_title">Last tag</div>
        <div class="panel-subtitle" data-i18n="last_sub">Most recently read tag</div>
      </div>
    </div>
    <div class="panel-body">
      <div>
        <div class="label" data-i18n="lbl_serial">Serial number</div>
        <div class="preview" id="lastSerial">–</div>
      </div>
      <div>
        <div class="label" data-i18n="lbl_content">Content</div>
        <div class="preview" id="lastContent">–</div>
      </div>
    </div>
  </section>

  <!-- Panel 3: Session list (multi mode) -->
  <section class="panel" id="sessionPanel" style="display:none">
    <div class="panel-header">
      <span class="panel-icon">📋</span>
      <div class="grow">
        <div class="panel-title" data-i18n="list_title">Session list</div>
        <div class="panel-subtitle" data-i18n="list_sub">Saved together at the end</div>
      </div>
      <span class="badge" id="count">0</span>
    </div>
    <div class="panel-body">
      <div class="list" id="list"></div>
      <div class="btn-grid">
        <button id="saveAllBtn" class="btn btn-primary" type="button" data-i18n="btn_save_all" disabled>Save all</button>
        <button id="clearBtn" class="btn btn-secondary" type="button" data-i18n="btn_clear" disabled>Clear list</button>
      </div>
    </div>
  </section>

</main>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ── Config (same sheet / script as the NFC generator) ─────────────────
 * SECURITY: a secret in browser code is public – validate on the server. 
 * google API
 */
const CFG = {
  //WRITER_URL: 'https://script.google.com/macros/s/AKfycbz-zEl907ls0HQeaI8vbTiP3cP6uvTpdw4lFE52NuDEbgaGml-4_ShuLnqYEwF2XZZG/exec',
  WRITER_URL: 'https://script.google.com/macros/s/AKfycbwCcwwXBPMvL7P66UVBcoPEApO29AS_oAS7c9bxN8KF7NazkOlGGraQp8otA_7Y5JbA/exec',
  SECRET:     '159753g9d5rt4sdfer7e5z4d6szo89fsef',
};

/* ── i18n ─────────────────────────────────────────────────────────────── */
const TR = {
  en: {
    subtitle:'NFC Serial Saver', scan_title:'Scan', scan_sub:'Choose a mode and read the tags',
    mode_single:'Single (auto-save)', mode_multi:'Multiple (session)',
    btn_start:'Start reading', btn_stop:'Stop reading', btn_save_all:'Save all', btn_clear:'Clear list',btn_back:'\u2190 Back',
    last_title:'Last tag', last_sub:'Most recently read tag', lbl_serial:'Serial number', lbl_content:'Content',
    list_title:'Session list', list_sub:'Saved together at the end', empty:'No tags read yet.',
    no_content:'(no content)',
    st_ready:'Ready. Press “Start reading”.',
    st_ns:'Web NFC is not supported on this browser/device (use Chrome on Android).',
    st_starting:'Starting NFC scan…',
    st_scan_single:'Scanning active – hold ONE tag to the back of the phone. It will be saved automatically.',
    st_scan_multi:'Scanning active – hold tags to the phone one by one. Press “Save all” when finished.',
    st_read:'Tag read: {s}',
    st_saving:'Saving to Google Sheet…',
    st_saved_one:'Saved ✅ {s}',
    st_saved_many:'{n} tag(s) saved to the sheet ✅',
    st_added:'Added to list: {s} ({n} total)',
    st_dup:'Already in the list: {s}',
    st_no_serial:'The tag was read but has no serial number.',
    st_read_err:'NFC read error – try again.',
    st_stopped:'Reading stopped.',
    st_save_fail:'Save failed: {e} – the list was kept, try again.',
    st_save_fail_single:'Save failed: {e}',
    st_empty:'The list is empty.',
    st_cleared:'List cleared.',
    st_removed:'Removed: {s}',
    st_confirm_clear:'Clear all tags from the list?',
    st_unsaved:'You have unsaved tags.',
  },
  hu: {
    subtitle:'NFC sorozatsz\u00e1m ment\u0151', scan_title:'Olvas\u00e1s', scan_sub:'V\u00e1lassz m\u00f3dot \u00e9s olvasd be a cimk\u00e9ket',
    mode_single:'Egyes (automatikus ment\u00e9s)', mode_multi:'T\u00f6bb (munkamenet)',
    btn_start:'Olvas\u00e1s ind\u00edt\u00e1sa', btn_stop:'Olvas\u00e1s le\u00e1ll\u00edt\u00e1sa', btn_save_all:'Mind ment\u00e9se', btn_clear:'Lista t\u00f6rl\u00e9se',btn_back:'\u2190 Vissza',
    last_title:'Utols\u00f3 cimke', last_sub:'Legutóbb beolvasott cimke', lbl_serial:'Sorozatsz\u00e1m', lbl_content:'Tartalom',
    list_title:'Munkamenet lista', list_sub:'A v\u00e9g\u00e9n egyben ment\u0151dik', empty:'M\u00e9g nincs beolvasott cimke.',
    no_content:'(nincs tartalom)',
    st_ready:'K\u00e9sz. Nyomd meg az \u201eOlvas\u00e1s ind\u00edt\u00e1sa\u201d gombot.',
    st_ns:'A Web NFC nem t\u00e1mogatott ezen a b\u00f6ng\u00e9sz\u0151n/eszk\u00f6z\u00f6n (haszn\u00e1lj Chrome-ot Androidon).',
    st_starting:'NFC olvas\u00e1s ind\u00edt\u00e1sa\u2026',
    st_scan_single:'Olvas\u00e1s akt\u00edv \u2013 tarts EGY cimk\u00e9t a telefon h\u00e1t\u00e1hoz. Automatikusan ment\u0151dik.',
    st_scan_multi:'Olvas\u00e1s akt\u00edv \u2013 tartsd oda a cimk\u00e9ket egyenk\u00e9nt. Ha k\u00e9sz, nyomd meg a \u201eMind ment\u00e9se\u201d gombot.',
    st_read:'Cimke beolvasva: {s}',
    st_saving:'Ment\u00e9s a Google t\u00e1bl\u00e1zatba\u2026',
    st_saved_one:'Mentve \u2705 {s}',
    st_saved_many:'{n} cimke mentve a t\u00e1bl\u00e1zatba \u2705',
    st_added:'Hozz\u00e1adva a list\u00e1hoz: {s} (\u00f6sszesen {n})',
    st_dup:'M\u00e1r szerepel a list\u00e1ban: {s}',
    st_no_serial:'A cimke beolvasva, de nincs sorozatsz\u00e1ma.',
    st_read_err:'NFC olvas\u00e1si hiba \u2013 pr\u00f3b\u00e1ld \u00fajra.',
    st_stopped:'Olvas\u00e1s le\u00e1ll\u00edtva.',
    st_save_fail:'Ment\u00e9s sikertelen: {e} \u2013 a lista megmaradt, pr\u00f3b\u00e1ld \u00fajra.',
    st_save_fail_single:'Ment\u00e9s sikertelen: {e}',
    st_empty:'A lista \u00fcres.',
    st_cleared:'Lista t\u00f6r\u00f6lve.',
    st_removed:'Elt\u00e1vol\u00edtva: {s}',
    st_confirm_clear:'Törlöd az összes cimkét a listából?',
    st_unsaved:'Vannak nem mentett cimk\u00e9k.',
  },
};
const LANG_KEY = 'fuvesztar_lang';
const lang = () => { try { return localStorage.getItem(LANG_KEY) || 'hu'; } catch { return 'hu'; } };
const t = (k, p = {}) => {
  let s = (TR[lang()] || TR.hu)[k] ?? TR.en[k] ?? k;
  for (const [a, b] of Object.entries(p)) s = s.replace('{' + a + '}', b);
  return s;
};

/* ── State ────────────────────────────────────────────────────────────── */
let mode = 'single';
let scan = null;          // AbortController of the active scan
let items = [];           // [{serial, content}]
let busy = false;         // save in progress
let lastStatus = ['st_ready', 'info', {}];

/* ── UI helpers ───────────────────────────────────────────────────────── */
function status(key, type = 'info', params = {}) {
  lastStatus = [key, type, params];
  const el = $('status');
  el.textContent = t(key, params);
  el.className = 'status-box ' + type;
  el.removeAttribute('data-i18n');
}
function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang()));
  if (lastStatus) status(...lastStatus);
  renderList();
}
function updateButtons() {
  const scanning = !!scan;
  $('startBtn').disabled = scanning || busy;
  $('stopBtn').disabled = !scanning;
  $('liveDot').style.display = scanning ? 'inline' : 'none';
  $('saveAllBtn').disabled = busy || !items.length;
  $('clearBtn').disabled = busy || !items.length;
  document.querySelectorAll('#modeToggle button').forEach(b => b.disabled = scanning || busy);
}
function renderList() {
  const list = $('list');
  $('count').textContent = items.length;
  list.replaceChildren();
  if (!items.length) {
    const e = document.createElement('div'); e.className = 'empty'; e.textContent = t('empty'); list.append(e);
  }
  items.forEach((it, i) => {
    const row = document.createElement('div'); row.className = 'item';
    const n = document.createElement('div'); n.className = 'num'; n.textContent = (i + 1) + '.';
    const box = document.createElement('div'); box.className = 'txt';
    const s = document.createElement('div'); s.className = 'ser'; s.textContent = it.serial;
    const c = document.createElement('div'); c.className = 'con'; c.textContent = it.content || t('no_content');
    box.append(s, c);
    const d = document.createElement('button'); d.className = 'del'; d.type = 'button'; d.textContent = '✕';
    d.disabled = busy;
    d.onclick = () => { items.splice(i, 1); status('st_removed', 'info', { s: it.serial }); renderList(); updateButtons(); };
    row.append(n, box, d); list.append(row);
  });
  updateButtons();
}
function showLast(serial, content) {
  $('lastSerial').textContent = serial || '–';
  $('lastContent').textContent = content || '–';
}

/* ── NFC helpers ──────────────────────────────────────────────────────── */
function decodeRecords(message) {
  return (message?.records || []).map(rec => {
    let value = '';
    try { value = new TextDecoder(rec.encoding || 'utf-8').decode(rec.data); } catch {}
    return { type: rec.recordType, value };
  });
}
/* Content = all text/url records, in tag order, joined by " | " */
const contentOf = records => records
  .filter(r => (r.type === 'text' || r.type === 'url') && r.value)
  .map(r => r.value.trim()).filter(Boolean).join(' | ');

/* ── Save to Google Sheet (same endpoint as the generator) ────────────
 * Column A = serial number, column B = content, one row per tag.        */
async function save(rows) {
  const payload = {
    key: CFG.SECRET,
    action: 'nfcSerials',
    rows: rows.map(r => ({ serialNum: r.serial, nfcData: r.content })),
  };
  const r = await fetch(CFG.WRITER_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload), redirect: 'follow',
  });
  const j = await r.json().catch(() => ({}));
  if (j.status !== 'success') throw new Error(j.error || 'Unknown error');
}

/* ── Scanning ─────────────────────────────────────────────────────────── */
function stopScan(silent) {
  scan?.abort(); scan = null; updateButtons();
  if (!silent) status('st_stopped', 'info');
}

async function startScan() {
  if (!('NDEFReader' in window)) return status('st_ns', 'error');
  stopScan(true);
  status('st_starting', 'info');
  const ac = new AbortController(); scan = ac;
  try {
    const ndef = new NDEFReader();
    ndef.addEventListener('reading', e => onTag(e), { signal: ac.signal });
    ndef.addEventListener('readingerror', () => status('st_read_err', 'warn'), { signal: ac.signal });
    await ndef.scan({ signal: ac.signal });
    status(mode === 'single' ? 'st_scan_single' : 'st_scan_multi', 'info');
  } catch (e) {
    scan = null;
    console.error(e);
    status('st_read_err', 'error');
  }
  updateButtons();
}

async function onTag(e) {
  if (busy) return;                                   // ignore taps while saving
  const serial = (e.serialNumber || '').toUpperCase();
  const content = contentOf(decodeRecords(e.message));
  if (!serial) return status('st_no_serial', 'warn');
  showLast(serial, content);
  if (navigator.vibrate) navigator.vibrate(80);

  if (mode === 'single') {
    stopScan(true);                                   // one tag only
    status('st_read', 'info', { s: serial });
    busy = true; updateButtons();
    status('st_saving', 'info');
    try { await save([{ serial, content }]); status('st_saved_one', 'success', { s: serial }); }
    catch (err) { console.error(err); status('st_save_fail_single', 'error', { e: err.message || err }); }
    finally { busy = false; updateButtons(); }
  } else {
    if (items.some(i => i.serial === serial)) return status('st_dup', 'warn', { s: serial });
    items.push({ serial, content });
    status('st_added', 'success', { s: serial, n: items.length });
    renderList();
  }
}

async function saveAll() {
  if (!items.length) return status('st_empty', 'warn');
  stopScan(true);
  busy = true; updateButtons(); renderList();
  status('st_saving', 'info');
  try {
    const n = items.length;
    await save(items);
    items = [];
    status('st_saved_many', 'success', { n });
  } catch (err) {
    console.error(err);
    status('st_save_fail', 'error', { e: err.message || err });
  } finally { busy = false; renderList(); }
}

/* ── Wiring ───────────────────────────────────────────────────────────── */
$('startBtn').onclick = startScan;
$('stopBtn').onclick = () => stopScan(false);
$('saveAllBtn').onclick = saveAll;
$('backBtn').onclick = () => location.href = 'Homepage.html';
  
$('clearBtn').onclick = () => {
  if (!items.length || !confirm(t('st_confirm_clear'))) return;
  items = []; status('st_cleared', 'info'); renderList();
};
document.querySelectorAll('#modeToggle button').forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll('#modeToggle button').forEach(x => x.classList.toggle('active', x === b));
  $('sessionPanel').style.display = mode === 'multi' ? '' : 'none';
  status('st_ready', 'info');
});
document.querySelectorAll('.lang-btn').forEach(b => b.onclick = () => {
  try { localStorage.setItem(LANG_KEY, b.dataset.lang); } catch {}
  applyTranslations();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && scan) stopScan(false); });
window.addEventListener('beforeunload', e => { if (items.length) { e.preventDefault(); e.returnValue = t('st_unsaved'); } });

applyTranslations();
})();
</script>
</body>
</html>
