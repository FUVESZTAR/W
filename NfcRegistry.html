<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NFC Serial Saver</title>
<link rel="icon" href="ico/favicon.ico" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --green:#2f7d32; --green-mid:#388e3c; --green-light:#4caf50;
  --green-pale:#e8f5e9; --green-pale2:#c8e6c9; --muted:#546354;
  --charcoal:#172217; --bg:#f5f8f3; --card:#fff;
  --border:rgba(47,125,50,.15);
  --shadow:0 4px 24px rgba(23,34,23,.08); --shadow-lg:0 12px 48px rgba(23,34,23,.14);
  --radius:18px; --radius-sm:10px; --tr:.22s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'DM Sans',sans-serif;
  background:radial-gradient(circle at top right,#dff0d8 0,var(--bg) 45%);
  color:var(--charcoal); line-height:1.6; min-height:100vh;
  cursor:url('ico/leaf.cur') 0 0, auto;
}
.page-wrapper{width:min(760px,96vw);margin:0 auto;padding:1rem 0 3rem;display:flex;flex-direction:column;gap:1rem}
.page-header{display:flex;align-items:center;justify-content:space-between;padding:.6rem 0;gap:.5rem;flex-wrap:wrap}
.page-title{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,4vw,1.9rem);font-weight:700;color:var(--green);line-height:1.1}
.page-subtitle{font-size:.82rem;color:var(--muted);font-weight:300}

/* RegToggle groups (language + mode) */
.rgToggle{display:flex;background:var(--green-pale2);border-radius:20px;padding:3px;gap:2px}
.rgToggle button{
  flex:1;padding:6px 14px;border-radius:16px;font-size:.8rem;font-weight:600;border:none;
  background:transparent;color:var(--green-mid);cursor:pointer;transition:all var(--tr);
  font-family:'DM Sans',sans-serif;
}
.rgToggle button.active{background:var(--green);color:#fff}
.rgToggle button:hover:not(.active){background:rgba(47,125,50,.12)}
.rgToggle.lang{flex-shrink:0}

/* Panels */
.panel{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow var(--tr)}
.panel:hover{box-shadow:var(--shadow-lg)}
.panel-header{display:flex;align-items:center;gap:9px;padding:16px 20px;border-bottom:1px solid var(--border)}
.panel-icon{font-size:1.2rem}
.panel-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:600;color:var(--green)}
.panel-subtitle{font-size:.73rem;color:var(--muted);font-weight:300}
.panel-header .grow{flex:1;min-width:0}
.panel-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.badge{padding:2px 10px;border-radius:10px;font-size:.78rem;background:var(--green-pale2);color:var(--green);font-weight:600}

/* Buttons */
.btn-grid{display:grid;gap:9px}
.btn-grid.one{grid-template-columns:1fr}
.btn-grid.cols-2 { grid-template-columns:1fr 1fr; }
.btn-grid.cols-1 { grid-template-columns:1fr; }
button.btn{
  padding:.75rem 1rem;font-size:.92rem;font-family:'DM Sans',sans-serif;border:none;
  border-radius:var(--radius-sm);cursor:pointer;font-weight:500;width:100%;
  transition:transform .15s,background var(--tr);
}
button.btn-primary{background:var(--green);color:#fff}
button.btn-primary:hover:not(:disabled){background:var(--green-mid);transform:translateY(-1px)}
button.btn-danger{background:#c62828;color:#fff}
button.btn-danger:hover:not(:disabled){background:#b71c1c}
button.btn-secondary{background:var(--green-pale2);color:var(--green);border:1px solid var(--border)}
button.btn-secondary:hover:not(:disabled){background:var(--green-pale)}
button.btn-back {background: none;color: var(--muted);border: 1px solid var(--border);font-size: .85rem;}
button:disabled{opacity:.55;cursor:not-allowed}

/* Status */
.rgStatus-box{
  text-align:center;font-weight:600;font-size:.88rem;padding:10px 12px;
  border-radius:var(--radius-sm);background:var(--green-pale);color:var(--muted);transition:.3s;
}
.rgStatus-box.info{background:#e3f0fc;color:#1565c0}
.rgStatus-box.success{background:var(--green-pale2);color:var(--green)}
.rgStatus-box.error{background:#fdecea;color:#c62828}
.rgStatus-box.warn{background:#fff4e0;color:#b26a00}
.rgLive{color:var(--green-light);animation:blink 1s infinite;font-weight:700}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* Last read + list */
.rgLabel{font-size:.79rem;font-weight:500}
.rgPreview{
  background:var(--green-pale);padding:12px 14px;border-radius:var(--radius-sm);word-break:break-all;
  font-family:monospace;font-size:.84rem;border:1px solid var(--border);min-height:48px;
}
.rgList{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto}
.rgItem{display:flex;align-items:flex-start;gap:10px;background:var(--green-pale);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px}
.rgItem .rgNum{font-weight:600;color:var(--green);min-width:1.6em}
.rgItem .rgTxt{flex:1;min-width:0;word-break:break-all}
.rgItem .rgSer{font-family:monospace;font-weight:600;font-size:.88rem}
.rgItem .rgCon{font-family:monospace;font-size:.78rem;color:var(--muted)}
.rgItem .rgDel{border:none;background:none;color:#c62828;font-size:1.1rem;cursor:pointer;line-height:1}
.rgEmpty{text-align:center;color:var(--muted);font-size:.85rem;padding:10px}
@media(max-width:480px){.btn-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="page-wrapper">

  <div class="page-header">
    <div>
      <div class="page-title">🌿 NFC</div>
      <div class="page-subtitle" data-i18n="regSubtitle">NFC Serial Saver</div>
    </div>
    <div class="rgToggle lang">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="hu">HU</button>
    </div>
  </div>

  <!-- Panel 1: Mode + scan -->
  <section class="panel">
    <div class="panel-header">
      <span class="panel-icon">📡</span>
      <div class="grow">
        <div class="panel-title" data-i18n="scan_title">Scan</div>
        <div class="panel-subtitle" data-i18n="scan_sub">Choose a mode and read the tags</div>
      </div>
      <span id="rgLiveDot" class="rgLive" style="display:none">● LIVE</span>
    </div>
    <div class="panel-body">
      <div class="rgToggle" id="regModeToggle">
        <button type="button" data-mode="single" class="active" data-i18n="rgMode_single">Single (auto-save)</button>
        <button type="button" data-mode="multi" data-i18n="rgMode_multi">Multiple (session)</button>
      </div>
      <div class="btn-grid cols-2">
        <button id="rgStartBtn" class="btn btn-primary" type="button" data-i18n="regBtn_start">Start reading</button>
        <button id="rgStopBtn" class="btn btn-danger" type="button" data-i18n="regBtn_stop" disabled>Stop reading</button>
      </div>
      <div id="rgStatus" class="rgStatus-box" data-i18n="regSt_ready">Ready. Press “Start reading”.</div>
      <div class="btn-grid cols-1">
          <button id="rgBackBtn" class="btn-back" type="button" data-i18n="btn_back">← Back</button>
      </div>
    </div>
  </section>

  <!-- Panel 2: Last read -->
  <section class="panel">
    <div class="panel-header">
      <span class="panel-icon">🔍</span>
      <div class="grow">
        <div class="panel-title" data-i18n="regLast_title">Last tag</div>
        <div class="panel-subtitle" data-i18n="regLast_sub">Most recently read tag</div>
      </div>
    </div>
    <div class="panel-body">
      <div>
        <div class="rgLabel" data-i18n="regLbl_serial">Serial number</div>
        <div class="rgPreview" id="rgLastSerial">–</div>
      </div>
      <div>
        <div class="rgLabel" data-i18n="regLbl_content">Content</div>
        <div class="rgPreview" id="rgLastContent">–</div>
      </div>
    </div>
  </section>

  <!-- Panel 3: Session list (multi mode) -->
  <section class="panel" id="rgSessionPanel" style="display:none">
    <div class="panel-header">
      <span class="panel-icon">📋</span>
      <div class="grow">
        <div class="panel-title" data-i18n="rgList_title">Session list</div>
        <div class="panel-subtitle" data-i18n="rgList_sub">Saved together at the end</div>
      </div>
      <span class="badge" id="rgCount">0</span>
    </div>
    <div class="panel-body">
      <div class="rgList" id="rgListId"></div>
      <div class="btn-grid">
        <button id="rgSaveAllBtn" class="btn btn-primary" type="button" data-i18n="regBtn_save_all" disabled>Save all</button>
        <button id="rgClearBtn" class="btn btn-secondary" type="button" data-i18n="regBtn_clear" disabled>Clear list</button>
      </div>
    </div>
  </section>

</main>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ── Config (same sheet / script as the NFC generator) ─────────────────
 * SECURITY: a secret in browser code is public – validate on the server. 
 * google API
 */
const CFG = {
  WRITER_URL: 'https://script.google.com/macros/s/AKfycbz-zEl907ls0HQeaI8vbTiP3cP6uvTpdw4lFE52NuDEbgaGml-4_ShuLnqYEwF2XZZG/exec',
  SECRET:     '159753g9d5rt4sdfer7e5z4d6szo89fsef',
};

/* ── i18n ─────────────────────────────────────────────────────────────── */
const TR = {
  en: {
    regSubtitle:'NFC Serial Saver', scan_title:'Scan', scan_sub:'Choose a mode and read the tags',
    rgMode_single:'Single (auto-save)', rgMode_multi:'Multiple (session)',
    regBtn_start:'Start reading', regBtn_stop:'Stop reading', regBtn_save_all:'Save all', regBtn_clear:'Clear list',btn_back:'\u2190 Back',
    regLast_title:'Last tag', regLast_sub:'Most recently read tag', regLbl_serial:'Serial number', regLbl_content:'Content',
    rgList_title:'Session list', rgList_sub:'Saved together at the end', rgEmpty:'No tags read yet.',
    regNo_content:'(no content)',
    regSt_ready:'Ready. Press “Start reading”.',
    reg_st_ns:'Web NFC is not supported on this browser/device (use Chrome on Android).',
    reg_st_starting:'Starting NFC scan…',
    reg_st_scan_single:'Scanning active – hold ONE tag to the back of the phone. It will be saved automatically.',
    reg_st_scan_multi:'Scanning active – hold tags to the phone one by one. Press “Save all” when finished.',
    reg_st_read:'Tag read: {s}',
    reg_st_saving:'Saving to Google Sheet…',
    reg_st_saved_one:'Saved ✅ {s}',
    reg_st_saved_many:'{n} tag(s) saved to the sheet ✅',
    reg_st_added:'Added to list: {s} ({n} total)',
    reg_st_dup:'Already in the list: {s}',
    reg_st_no_serial:'The tag was read but has no serial number.',
    reg_st_read_err:'NFC read error – try again.',
    reg_st_stopped:'Reading stopped.',
    reg_st_save_fail:'Save failed: {e} – the list was kept, try again.',
    reg_st_save_fail_single:'Save failed: {e}',
    reg_st_empty:'The list is empty.',
    reg_st_cleared:'List cleared.',
    reg_st_removed:'Removed: {s}',
    reg_st_confirm_clear:'Clear all tags from the list?',
    reg_st_unsaved:'You have unsaved tags.',
  },
  hu: {
    regSubtitle:'NFC sorozatsz\u00e1m ment\u0151', scan_title:'Olvas\u00e1s', scan_sub:'V\u00e1lassz m\u00f3dot \u00e9s olvasd be a cimk\u00e9ket',
    rgMode_single:'Egyes (automatikus ment\u00e9s)', rgMode_multi:'T\u00f6bb (munkamenet)',
    regBtn_start:'Olvas\u00e1s ind\u00edt\u00e1sa', regBtn_stop:'Olvas\u00e1s le\u00e1ll\u00edt\u00e1sa', regBtn_save_all:'Mind ment\u00e9se', regBtn_clear:'Lista t\u00f6rl\u00e9se',btn_back:'\u2190 Vissza',
    regLast_title:'Utols\u00f3 cimke', regLast_sub:'Legutóbb beolvasott cimke', regLbl_serial:'Sorozatsz\u00e1m', regLbl_content:'Tartalom',
    rgList_title:'Munkamenet lista', rgList_sub:'A v\u00e9g\u00e9n egyben ment\u0151dik', rgEmpty:'M\u00e9g nincs beolvasott cimke.',
    regNo_content:'(nincs tartalom)',
    regSt_ready:'K\u00e9sz. Nyomd meg az \u201eOlvas\u00e1s ind\u00edt\u00e1sa\u201d gombot.',
    reg_st_ns:'A Web NFC nem t\u00e1mogatott ezen a b\u00f6ng\u00e9sz\u0151n/eszk\u00f6z\u00f6n (haszn\u00e1lj Chrome-ot Androidon).',
    reg_st_starting:'NFC olvas\u00e1s ind\u00edt\u00e1sa\u2026',
    reg_st_scan_single:'Olvas\u00e1s akt\u00edv \u2013 tarts EGY cimk\u00e9t a telefon h\u00e1t\u00e1hoz. Automatikusan ment\u0151dik.',
    reg_st_scan_multi:'Olvas\u00e1s akt\u00edv \u2013 tartsd oda a cimk\u00e9ket egyenk\u00e9nt. Ha k\u00e9sz, nyomd meg a \u201eMind ment\u00e9se\u201d gombot.',
    reg_st_read:'Cimke beolvasva: {s}',
    reg_st_saving:'Ment\u00e9s a Google t\u00e1bl\u00e1zatba\u2026',
    reg_st_saved_one:'Mentve \u2705 {s}',
    reg_st_saved_many:'{n} cimke mentve a t\u00e1bl\u00e1zatba \u2705',
    reg_st_added:'Hozz\u00e1adva a list\u00e1hoz: {s} (\u00f6sszesen {n})',
    reg_st_dup:'M\u00e1r szerepel a list\u00e1ban: {s}',
    reg_st_no_serial:'A cimke beolvasva, de nincs sorozatsz\u00e1ma.',
    reg_st_read_err:'NFC olvas\u00e1si hiba \u2013 pr\u00f3b\u00e1ld \u00fajra.',
    reg_st_stopped:'Olvas\u00e1s le\u00e1ll\u00edtva.',
    reg_st_save_fail:'Ment\u00e9s sikertelen: {e} \u2013 a lista megmaradt, pr\u00f3b\u00e1ld \u00fajra.',
    reg_st_save_fail_single:'Ment\u00e9s sikertelen: {e}',
    reg_st_empty:'A lista \u00fcres.',
    reg_st_cleared:'Lista t\u00f6r\u00f6lve.',
    reg_st_removed:'Elt\u00e1vol\u00edtva: {s}',
    reg_st_confirm_clear:'Törlöd az összes cimkét a listából?',
    reg_st_unsaved:'Vannak nem mentett cimk\u00e9k.',
  },
};
const LANG_KEY = 'fuvesztar_lang';
const lang = () => { try { return localStorage.getItem(LANG_KEY) || 'hu'; } catch { return 'hu'; } };
const t = (k, p = {}) => {
  let s = (TR[lang()] || TR.hu)[k] ?? TR.en[k] ?? k;
  for (const [a, b] of Object.entries(p)) s = s.replace('{' + a + '}', b);
  return s;
};

/* ── State ────────────────────────────────────────────────────────────── */
let rgMode = 'single';
let scan = null;          // AbortController of the active scan
let rgItems = [];           // [{serial, content}]
let busy = false;         // save in progress
let lastStatus = ['regSt_ready', 'info', {}];

/* ── UI helpers ───────────────────────────────────────────────────────── */
function rgStatusSet(key, type = 'info', params = {}) {
  lastStatus = [key, type, params];
  const el = $('rgStatus');
  el.textContent = t(key, params);
  el.className = 'rgStatus-box ' + type;
  el.removeAttribute('data-i18n');
}
function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.rgToggle('active', b.dataset.lang === lang()));
  if (lastStatus) rgStatusSet(...lastStatus);
  rgRenderList();
}
function rgUpdateButtons() {
  const rgScanning = !!scan;
  $('rgStartBtn').disabled = rgScanning || busy;
  $('rgStopBtn').disabled = !rgScanning;
  $('rgLiveDot').style.display = rgScanning ? 'inline' : 'none';
  $('rgSaveAllBtn').disabled = busy || !rgItems.length;
  $('rgClearBtn').disabled = busy || !rgItems.length;
  document.querySelectorAll('#regModeToggle button').forEach(b => b.disabled = rgScanning || busy);
}
function rgRenderList() {
  const rgListV= $('rgListId');
  $('rgCount').textContent = rgItems.length;
  rgListV.replaceChildren();
  if (!rgItems.length) {
    const e = document.createElement('div'); e.className = 'rgEmpty'; e.textContent = t('rgEmpty'); rgListV.append(e);
  }
  rgItems.forEach((it, i) => {
    const row = document.createElement('div'); row.className = 'rgItem';
    const n = document.createElement('div'); n.className = 'rgNum'; n.textContent = (i + 1) + '.';
    const box = document.createElement('div'); box.className = 'rgTxt';
    const s = document.createElement('div'); s.className = 'rgSer'; s.textContent = it.serial;
    const c = document.createElement('div'); c.className = 'rgCon'; c.textContent = it.content || t('regNo_content');
    box.append(s, c);
    const d = document.createElement('button'); d.className = 'rgDel'; d.type = 'button'; d.textContent = '✕';
    d.disabled = busy;
    d.onclick = () => { rgItems.splice(i, 1); rgStatus('reg_st_removed', 'info', { s: it.serial }); rgRenderList(); rgUpdateButtons(); };
    row.append(n, box, d); rgListV.append(row);
  });
  rgUpdateButtons();
}
function rgShowLast(serial, content) {
  $('rgLastSerial').textContent = serial || '–';
  $('rgLastContent').textContent = content || '–';
}

/* ── NFC helpers ──────────────────────────────────────────────────────── */
function rgDecodeRecords(message) {
  return (message?.records || []).map(rec => {
    let value = '';
    try { value = new TextDecoder(rec.encoding || 'utf-8').decode(rec.data); } catch {}
    return { type: rec.recordType, value };
  });
}
/* Content = all text/url records, in tag order, joined by " | " */
const rgContentOf = records => records
  .filter(r => (r.type === 'text' || r.type === 'url') && r.value)
  .map(r => r.value.trim()).filter(Boolean).join(' | ');

/* ── Save to Google Sheet (same endpoint as the generator) ────────────
 * Column A = serial number, column B = content, one row per tag.        */
async function rgSave(rows) {
  const payload = {
    key: CFG.SECRET,
    action: 'nfcSerials',
    rows: rows.map(r => ({ serialNum: r.serial, nfcData: r.content })),
  };
  const r = await fetch(CFG.WRITER_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload), redirect: 'follow',
  });
  const j = await r.json().catch(() => ({}));
  if (j.rgStatus !== 'success') throw new Error(j.error || 'Unknown error');
}

/* ── Scanning ─────────────────────────────────────────────────────────── */
function rgStopScan(silent) {
  scan?.abort(); scan = null; rgUpdateButtons();
  if (!silent) rgStatusSet('reg_st_stopped', 'info');
}

async function rgStartScan() {
  if (!('NDEFReader' in window)) return rgStatusSet('reg_st_ns', 'error');
  rgStopScan(true);
  rgStatusSet('reg_st_starting', 'info');
  const ac = new AbortController(); scan = ac;
  try {
    const ndef = new NDEFReader();
    ndef.addEventListener('reading', e => rgOnTag(e), { signal: ac.signal });
    ndef.addEventListener('readingerror', () => rgStatusSet('reg_st_read_err', 'warn'), { signal: ac.signal });
    await ndef.scan({ signal: ac.signal });
    rgStatusSet(rgMode === 'single' ? 'reg_st_scan_single' : 'reg_st_scan_multi', 'info');
  } catch (e) {
    scan = null;
    console.error(e);
    rgStatusSet('reg_st_read_err', 'error');
  }
  rgUpdateButtons();
}

async function rgOnTag(e) {
  if (busy) return;                                   // ignore taps while saving
  const serial = (e.serialNumber || '').toUpperCase();
  const content = rgContentOf(rgDecodeRecords(e.message));
  if (!serial) return rgStatusSet('reg_st_no_serial', 'warn');
  rgShowLast(serial, content);
  if (navigator.vibrate) navigator.vibrate(80);

  if (rgMode === 'single') {
    rgStopScan(true);                                   // one tag only
    rgStatusSet('reg_st_read', 'info', { s: serial });
    busy = true; rgUpdateButtons();
    rgStatusSet('reg_st_saving', 'info');
    try { await rgSave([{ serial, content }]); rgStatusSet('reg_st_saved_one', 'success', { s: serial }); }
    catch (err) { console.error(err); rgStatusSet('reg_st_save_fail_single', 'error', { e: err.message || err }); }
    finally { busy = false; rgUpdateButtons(); }
  } else {
    if (rgItems.some(i => i.serial === serial)) return rgStatusSet('reg_st_dup', 'warn', { s: serial });
    rgItems.push({ serial, content });
    rgStatusSet('reg_st_added', 'success', { s: serial, n: rgItems.length });
    rgRenderList();
  }
}

async function rgSaveAll() {
  if (!rgItems.length) return rgStatusSet('reg_st_empty', 'warn');
  rgStopScan(true);
  busy = true; rgUpdateButtons(); rgRenderList();
  rgStatusSet('reg_st_saving', 'info');
  try {
    const n = rgItems.length;
    await rgSave(rgItems);
    rgItems = [];
    rgStatusSet('reg_st_saved_many', 'success', { n });
  } catch (err) {
    console.error(err);
    rgStatusSet('reg_st_save_fail', 'error', { e: err.message || err });
  } finally { busy = false; rgRenderList(); }
}

/* ── Wiring ───────────────────────────────────────────────────────────── */
$('rgStartBtn').onclick = rgStartScan;
$('rgStopBtn').onclick = () => rgStopScan(false);
$('rgSaveAllBtn').onclick = rgSaveAll;
$('rgBackBtn').onclick = () => location.href = 'Homepage.html';
  
$('rgClearBtn').onclick = () => {
  if (!rgItems.length || !confirm(t('reg_st_confirm_clear'))) return;
  rgItems = []; rgStatusSet('reg_st_cleared', 'info'); rgRenderList();
};
document.querySelectorAll('#regModeToggle button').forEach(b => b.onclick = () => {
  rgMode = b.dataset.rgMode;
  document.querySelectorAll('#regModeToggle button').forEach(x => x.classList.rgToggle('active', x === b));
  $('rgSessionPanel').style.display = rgMode === 'multi' ? '' : 'none';
  rgStatusSet('regSt_ready', 'info');
});
document.querySelectorAll('.lang-btn').forEach(b => b.onclick = () => {
  try { localStorage.setItem(LANG_KEY, b.dataset.lang); } catch {}
  applyTranslations();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && scan) rgStopScan(false); });
window.addEventListener('beforeunload', e => { if (rgItems.length) { e.preventDefault(); e.returnValue = t('reg_st_unsaved'); } });

applyTranslations();
})();
